<style>
  :root {

    --stage: #d6dade;

    --card: #ffffff;
    --ink: #15181b;
    --text2: #3b4148;
    --muted: #7a828a;
    --line: #dcdfe3;
    --black: #0b0c0d;

    --accent-strong: #0d9488;
    --accent-soft: rgba(20, 184, 166, .12);

    --topbar: 56px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);

  .topbar {
    height: var(--topbar); flex: none; background: var(--black); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #23272b;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
  .brand h1 i { font-style: normal; color: var(--accent); }
  .brand > span { font-size: 13px; color: #8b939b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; flex: none; }
  .langtabs { display: flex; gap: 2px; background: rgba(255,255,255,.06); border: 1px solid #262b30; border-radius: 9999px; padding: 3px; }
  .langtabs button {
    font: inherit; font-size: 12px; font-weight: 700; padding: 6px 12px; border: 0; border-radius: 9999px;
    background: transparent; color: #9aa1a8; cursor: pointer;
  }
  .langtabs button:hover:not(.active) { color: #fff; background: transparent; }
  .langtabs button.active { background: var(--accent); color: var(--accent-ink); }

  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
  .stage {
    position: sticky; top: var(--topbar); height: calc(100vh - var(--topbar));
    background: radial-gradient(ellipse at 50% 40%, #e2e5e8 0%, var(--stage) 70%);
    padding: 20px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; overflow: hidden;
  }
  .stage.drag { outline: 3px dashed var(--accent); outline-offset: -12px; }
  .viewtabs { display: flex; gap: 4px; background: rgba(255,255,255,.7); border: 1px solid var(--line); border-radius: 9999px; padding: 3px; flex: none; }
  .viewtabs button { border: 0; background: transparent; padding: 6px 16px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .viewtabs button.active { background: var(--black); color: #fff; }
  .viewtabs button.active:hover:not(:disabled) { background: var(--black); color: #fff; }
  .view { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #cv, #gifImg {
    display: block; max-width: 100%; max-height: 100%; width: auto; height: auto;
    border-radius: 6px; box-shadow: 0 10px 40px rgba(11,12,13,.28); background: #0b0e2a;
  }
  #cv { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  #cv.dragging { cursor: grabbing; }
  .transport { flex: none; display: flex; align-items: center; gap: 10px; width: min(560px, 100%); }
  .transport button { width: 40px; height: 34px; padding: 0; font-size: 13px; flex: none; }
  .transport input[type=range] { flex: 1; }
  .transport .tm { font-size: 12px; color: var(--muted); min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  .tagline { flex: none; margin: 0; font-size: 13px; color: var(--text2); text-align: center; letter-spacing: -0.01em; }

  .side {
    background: var(--panel); border-left: 1px solid var(--line);
    height: calc(100vh - var(--topbar)); position: sticky; top: var(--topbar);
    overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;
  }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .box h2 { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row + .row { margin-top: 12px; }
  .row > label { font-size: 13px; min-width: 76px; color: var(--text2); }
  .row .val { font-size: 12px; color: var(--muted); min-width: 40px; text-align: right; }
  .toggle-group { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .toggle-group button { flex: 1; font-size: 12px; font-weight: 600; padding: 7px 8px; border-radius: 8px; white-space: nowrap; }
  .toggle-group button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); cursor: pointer; }
  .check-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  input[type=color] { width: 40px; height: 32px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; flex: none; }
  button {
    font: inherit; font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 9999px;
    border: 1px solid var(--line); background: #fff; color: var(--text2); cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 8px 18px; font-size: 14px; }
  button.primary:hover:not(:disabled) { background: #2dd4bf; border-color: #2dd4bf; color: var(--accent-ink); }
  button.dark { background: var(--black); border-color: var(--black); color: #fff; font-weight: 600; }
  button.dark:hover:not(:disabled) { background: #23272b; border-color: #23272b; color: #fff; }
  .full { width: 100%; }
  .hint { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

  @media (max-width: 860px) {

    .langtabs button { padding: 6px 9px; }
    html, body { height: auto; }
    main { display: block; }
    .stage { position: sticky; top: var(--topbar); z-index: 5; height: 52vh; min-height: 280px; padding: 10px 12px; gap: 8px; box-shadow: 0 6px 16px rgba(11,12,13,.18); }
    .tagline { display: none; }
    .side { position: static; height: auto; border-left: 0; border-top: 1px solid var(--line); overflow: visible; padding-bottom: 84px; }
    .mobilebar { display: block; }

  @media (pointer: coarse) {

    input[type=range] { height: 34px; }
    input[type=color] { width: 48px; height: 40px; }
    .check-row { min-height: 36px; }
    .check-row input[type=checkbox] { width: 22px; height: 22px; }
    .toggle-group button { padding: 9px 8px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1><span style="color:#fff;font-size:inherit">cat</span><i>napped</i></h1>
    <span>제작: <a href="https://x.com/swoonqx" target="_blank" rel="noopener noreferrer" style="color:#8b939b; text-decoration:none;">𝕏 @swoonqx</a></span>
  </div>
  <div class="topbar-actions">
    <div class="langtabs" id="langTabs" role="tablist" aria-label="Language / 언어 선택">

</header>

<main>
  <section class="stage" id="stage">
    <div class="viewtabs" id="viewTabs">
      <button type="button" class="active" data-view="preview" data-i18n="viewPreview">실시간 미리보기</button>

    </div>
    <div class="view" id="view">
      <canvas id="cv" aria-label="preview"></canvas>
      <img id="gifImg" alt="result GIF" hidden>
    </div>
    <div class="transport" id="transport">
      <button type="button" id="playBtn" aria-label="play / pause">❚❚</button>
      <input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="timeline">
      <span class="tm" id="tm">0.0s</span>
    </div>
    <p class="tagline" id="tagline"></p>
  </section>

  <aside class="side">
    <div class="box">
      <h2 data-i18n="image">캐릭터 이미지</h2>
      <button id="pickBtn" class="full dark" data-i18n="pickImage">이미지 선택</button>
      <button id="sampleBtn" class="full" style="margin-top:8px" data-i18n="useSample">샘플 캐릭터 사용</button>
      <p class="hint" id="imgInfo"></p>
      <p class="hint" data-i18n="imageHint">배경이 투명한 PNG를 권장해요. 화면에 끌어다 놓거나 붙여넣기도 가능해요.</p>
      <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp">
    </div>

    <div class="box">
      <h2 data-i18n="chrBox">캐릭터 위치 · 크기</h2>
      <div class="row"><label data-i18n="chrSize">크기</label><input type="range" id="chrSize" min="40" max="160" step="5" value="100"><span class="val" id="chrSizeVal"></span></div>
      <button type="button" id="chrReset" class="full" style="margin-top:12px" data-i18n="chrReset">위치 · 크기 초기화</button>
      <p class="hint" data-i18n="chrHint">미리보기 화면에서 캐릭터를 끌어서 옮길 수 있어요.</p>
    </div>

    <div class="box">
      <h2 data-i18n="ufoBox">UFO · 빔</h2>
      <div class="row"><label data-i18n="from">등장 방향</label>
        <div class="toggle-group" id="fromGroup">
          <button type="button" data-v="right" class="active" data-i18n="fromRight">오른쪽</button>
          <button type="button" data-v="left" data-i18n="fromLeft">왼쪽</button>
          <button type="button" data-v="top" data-i18n="fromTop">위</button>
        </div></div>
      <div class="row"><label data-i18n="beamColor">빔 색</label><input type="color" id="beamColor" value="#7dfbe6">
        <div class="swatches" id="beamSw"></div></div>
      <div class="row"><label data-i18n="starAmt">별 효과</label><input type="range" id="starAmt" min="0" max="40" step="2" value="24"><span class="val" id="starAmtVal"></span></div>
    </div>

    <div class="box">
      <h2 data-i18n="sceneBox">배경</h2>
      <div class="row"><label data-i18n="ratio">화면 비율</label>
        <div class="toggle-group" id="ratioGroup">
          <button type="button" data-v="1:1" class="active">1:1</button>
          <button type="button" data-v="4:3">4:3</button>
          <button type="button" data-v="3:4">3:4</button>
          <button type="button" data-v="16:9">16:9</button>
        </div></div>
      <div class="row"><label data-i18n="bg">배경</label>
        <div class="toggle-group" id="bgGroup">
          <button type="button" data-v="night" class="active" data-i18n="bgNight">밤하늘</button>
          <button type="button" data-v="solid" data-i18n="bgSolid">단색</button>
        </div></div>
      <div class="row" id="bgColorRow" hidden><label data-i18n="bgColor">배경색</label><input type="color" id="bgColor" value="#2b2f6b">
        <div class="swatches" id="bgSw"></div></div>
      <div class="row"><label class="check-row" for="ground"><input type="checkbox" id="ground" checked><span data-i18n="ground">바닥 표시</span></label></div>
      <div class="row"><label class="check-row" for="shadow"><input type="checkbox" id="shadow" checked><span data-i18n="shadow">캐릭터 그림자</span></label></div>
    </div>

    <div class="box" id="gifBox"></div>

    <div class="box">
      <p class="hint" style="margin:0" data-i18n="license">만든 GIF는 자유롭게 사용 가능합니다.</p>
      <p class="hint" style="margin:6px 0 0"><span data-i18n="sampleCredit">샘플 캐릭터:</span> <a href="https://www.irasutoya.com/2013/09/blog-post_8739.html" target="_blank" rel="noopener noreferrer" style="color:inherit">いらすとや</a></p>
    </div>
  </aside>
</main>
<div class="mobilebar"><button id="makeBar" class="primary" data-i18n="makeGif">GIF 만들기</button></div>

<script src="sample-boy.js"></script>
<script src="gif-export.js"></script>
<script src="color-picker.js"></script>
<script>
'use strict';
let gx = null;   // GifExport panel
/* ============================== i18n ============================== */
const LANGS = ['ko', 'en', 'ja', 'zh'];
const S = {
  madeBy: ['제작:', 'Made by:', '制作:', '制作:'],
  tagline: ['UFO를 탄 외계인 고양이가 내 캐릭터를 데려가요!', 'An alien cat in a UFO is coming to take your character away!', 'UFOに乗った宇宙人ネコが、あなたのキャラをさらいに来ます！', '乘着 UFO 的外星猫咪，要把你的角色带走啦！'],
  makeGif: ['GIF 만들기', 'Make GIF', 'GIFを作る', '生成 GIF'],
  viewPreview: ['실시간 미리보기', 'Live preview', 'リアルタイムプレビュー', '实时预览'],
  viewGif: ['완성된 GIF', 'Finished GIF', '完成したGIF', '生成的 GIF'],
  image: ['캐릭터 이미지', 'Character image', 'キャラ画像', '角色图片'],
  pickImage: ['이미지 선택', 'Choose image', '画像を選択', '选择图片'],
  useSample: ['샘플 캐릭터 사용', 'Use sample character', 'サンプルキャラを使う', '使用示例角色'],
  imageHint: ['배경이 투명한 PNG를 권장해요. 화면에 끌어다 놓거나 붙여넣기도 가능해요.', 'A PNG with a transparent background works best. You can also drop or paste onto the page.', '背景が透明なPNGがおすすめです。画面へのドロップや貼り付けもできます。', '推荐使用透明背景的 PNG。也可以拖放或粘贴到页面上。'],
  imgInfo: ['{w}×{h}px (투명 여백 제외)', '{w}×{h}px (transparent margins trimmed)', '{w}×{h}px（透明な余白を除く）', '{w}×{h}px（已去除透明边距）'],
  imgFail: ['이미지를 읽을 수 없어요. png/jpg/gif/webp 파일인지 확인해 주세요.', 'Could not read the image. Please use a png/jpg/gif/webp file.', '画像を読み込めません。png/jpg/gif/webpファイルか確認してください。', '无法读取图片，请确认是 png/jpg/gif/webp 文件。'],
  chrBox: ['캐릭터 위치 · 크기', 'Character position & size', 'キャラの位置・サイズ', '角色位置与大小'],
  chrSize: ['크기', 'Size', 'サイズ', '大小'],
  chrReset: ['위치 · 크기 초기화', 'Reset position & size', '位置・サイズをリセット', '重置位置与大小'],
  chrHint: ['미리보기 화면에서 캐릭터를 끌어서 옮길 수 있어요.', 'Drag the preview to move the character.', 'プレビュー画面でドラッグして動かせます。', '在预览画面中拖动即可移动角色。'],
  ufoBox: ['UFO · 빔', 'UFO & beam', 'UFO・ビーム', 'UFO 与光束'],
  from: ['등장 방향', 'Arrives from', '登場方向', '出现方向'],
  fromRight: ['오른쪽', 'Right', '右', '右侧'],
  fromLeft: ['왼쪽', 'Left', '左', '左侧'],
  fromTop: ['위', 'Top', '上', '上方'],
  beamColor: ['빔 색', 'Beam color', 'ビームの色', '光束颜色'],
  starAmt: ['별 효과', 'Star sparkles', '星のエフェクト', '星星特效'],
  sceneBox: ['배경', 'Background', '背景', '背景'],
  ratio: ['화면 비율', 'Aspect ratio', '画面比率', '画面比例'],
  bg: ['배경', 'Sky', '背景', '背景'],
  bgNight: ['밤하늘', 'Night', '夜空', '夜空'],
  bgSolid: ['단색', 'Solid', '単色', '纯色'],
  bgColor: ['배경색', 'Color', '背景色', '背景色'],
  ground: ['바닥 표시', 'Show ground', '地面を表示', '显示地面'],
  shadow: ['캐릭터 그림자', 'Character shadow', 'キャラの影', '角色阴影'],
  sampleCredit: ['샘플 캐릭터:', 'Sample character:', 'サンプルキャラ:', '示例角色:'],
  license: ['만든 GIF는 자유롭게 사용 가능합니다.', 'The GIFs you make are free to use.', '作成したGIFは自由に使用できます。', '制作的 GIF 可自由使用。']
};
let lang = (() => {
  try { const v = localStorage.getItem('catnapped-lang'); if (LANGS.includes(v)) return v; } catch (e) {}
  const n = (navigator.language || 'ko').slice(0, 2); return LANGS.includes(n) ? n : 'ko';
})();
const t = (k, vars) => {
  const e = S[k]; let s = e ? (e[LANGS.indexOf(lang)] || e[1]) : k;
  if (vars) for (const v in vars) s = s.replace('{' + v + '}', vars[v]);
  return s;
};

/* ============================== utils ============================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = u => u * u * (3 - 2 * u);
const TAU = Math.PI * 2;
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}
function shade(hex, amt) {       // amt < 0 → toward black, > 0 → toward white
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, n >> 8 & 255, n & 255];
  const t0 = amt < 0 ? 0 : 255, k = Math.abs(amt);
  return '#' + c.map(v => Math.round(lerp(v, t0, k)).toString(16).padStart(2, '0')).join('');

  const lg = g.createLinearGradient(0, -8, 0, 68);
  lg.addColorStop(0, '#fbf1ea'); lg.addColorStop(1, '#f2e2da');
  disc_(); g.fillStyle = lg; g.fill();
  g.save(); disc_(); g.clip();
  // cyan rim along the whole lower edge (one continuous band)
  g.strokeStyle = '#5ae6d8'; g.lineWidth = 16;
  g.beginPath(); g.moveTo(-180, 40); g.bezierCurveTo(-170, 58, -120, 70, 0, 72); g.bezierCurveTo(120, 70, 170, 58, 180, 40); g.stroke();
  // one continuous groove
  g.strokeStyle = LINE_PINK; g.lineWidth = 3.4;
  g.beginPath(); g.moveTo(-170, 26); g.bezierCurveTo(-120, 46, -50, 50, 0, 50); g.bezierCurveTo(50, 50, 120, 46, 170, 26); g.stroke();
  g.restore();
  // three round lights
  for (const x of [-80, 0, 80]) {
    const y = x ? 24 : 27;
    g.fillStyle = '#ea7a80'; g.strokeStyle = LINE_PINK; g.lineWidth = 2.8;
    g.beginPath(); g.arc(x, y, 9, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.55)'; disc(g, x - 2.8, y - 3, 2.6);
  }
  disc_(); g.strokeStyle = LINE_PINK; g.lineWidth = 3.4; g.stroke();
}
function drawUfoAt(g, L, p, pose, b) {
  const happy = p >= 0.64 && p <= 0.90;
  const blink = (p >= 0.17 && p < 0.185) || (p >= 0.50 && p < 0.51) || (p >= 0.93 && p < 0.945);
  g.save();
  g.translate(pose.x, pose.y); g.rotate(pose.rot); g.scale(L.s * pose.sx, L.s * pose.sy);
  drawUfo(g, {
    t: p, color: st.beam, glow: b,
    wig: Math.sin(TAU * p * 6),
    eye: happy ? 'happy' : blink ? 'blink' : 'open',
    mouth: happy ? 'grin' : (p >= T.beam0 && p < T.off1) ? 'open' : 'smile'
  });
  g.restore();
}

/* ============================== star trail ============================== */
function drawTrail(g, L, p) {
  const N = st.stars;
  if (!N || p < T.spawn0) return;
  for (let i = 0; i < N; i++) {
    const d = TRAIL[i % TRAIL.length], f = i / Math.max(1, N - 1);
    const ts = lerp(T.spawn0, T.spawn1, f);
    const life = clamp(0.995 - ts, 0.07, 0.2);
    const tau = (p - ts) / life;
    if (tau < 0 || tau > 1) continue;
    const c = ufoAt(ts, L);
    const x = c.x + d.jx * 130 * L.s, y = c.y + d.jy * 80 * L.s + tau * 0.03 * L.H;
    // opaque stars that pop in and shrink away (no translucent, muddy fading)
    const env = smooth(Math.min(tau / 0.18, 1)) * (1 - smooth(clamp((tau - 0.6) / 0.4, 0, 1)));
    const tw = 0.8 + 0.2 * Math.sin(TAU * tau * d.cyc * 2);
    const r = (16 + 22 * d.sz) * Math.max(0.7, L.s * 1.3) * tw * env;
    if (r < 0.6) continue;
    g.fillStyle = STAR_COLORS[d.col];
    star4(g, x, y, r, d.rot + tau * 0.8);
    g.fillStyle = STAR_COLORS[(d.col + 1) % 4];
    disc(g, x + r * 0.9 * (d.dot > .5 ? 1 : -1), y - r * 0.7, r * 0.16);
    star4(g, x - r * 0.95 * (d.dot > .5 ? 1 : -1), y + r * 0.8, r * 0.38, 0.4);
  }
}

/* ============================== scene ============================== */
function drawScene(g, w, p) {
  if (!chr) return;
  const W = SW, H = sceneH();
  g.setTransform(w / W, 0, 0, w / W, 0, 0);
  const L = layoutScene(W, H);
  drawBg(g, L, p);
  if (st.ground) drawGround(g, L);
  const b = beamAmt(p), a = liftAmt(p), pose = ufoPose(p, L);
  const charOn = p < T.off0 + 0.001 && a < 0.995;
  if (st.shadow && charOn) {
    const rx = L.cw * 0.46 * (1 - a * 0.55);
    g.fillStyle = 'rgba(0,0,0,' + (0.3 * (1 - a)).toFixed(3) + ')';
    g.beginPath(); g.ellipse(L.ax, L.ay + 1, rx, rx * 0.2, 0, 0, TAU); g.fill();
  }
  if (b > 0.001) drawBeamBack(g, L, pose, b, p);
  if (charOn) drawChar(g, L, p, pose, a, b);
  if (b > 0.001) drawBeamFront(g, L, pose, b, p);
  drawTrail(g, L, p);
  if (p >= T.enter0 - 0.02 && p <= 0.93) drawUfoAt(g, L, p, pose, b);
}

/* ============================== character loading ============================== */
function setCharacter(source, w, h) {
  const sc = Math.min(1, 900 / Math.max(w, h));
  const cw = Math.max(1, Math.round(w * sc)), chh = Math.max(1, Math.round(h * sc));
  const c = mkCanvas(cw, chh), cg = c.getContext('2d', { willReadFrequently: true });
  cg.drawImage(source, 0, 0, cw, chh);
  let d; try { d = cg.getImageData(0, 0, cw, chh).data; } catch (e) { d = new Uint8ClampedArray(cw * chh * 4).fill(255); }   // file:// → no pixel access
  let x0 = cw, y0 = chh, x1 = -1, y1 = -1;
  for (let y = 0; y < chh; y++) for (let x = 0; x < cw; x++) {
    if (d[(y * cw + x) * 4 + 3] > 12) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) { x0 = 0; y0 = 0; x1 = cw - 1; y1 = chh - 1; }
  const tw = x1 - x0 + 1, th = y1 - y0 + 1;
  const tc = mkCanvas(tw, th); tc.getContext('2d').drawImage(c, x0, y0, tw, th, 0, 0, tw, th);
  chr = { c: tc, w: tw, h: th, tint: {} };
  $('imgInfo').textContent = t('imgInfo', { w: tw, h: th });
  if (gx) gx.refresh();
}
function loadFile(f) {
  if (!f || !/^image\//.test(f.type)) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => { setCharacter(im, im.naturalWidth, im.naturalHeight); URL.revokeObjectURL(url); resetPos(); setPhase(0); };
  im.onerror = () => { URL.revokeObjectURL(url); alert(t('imgFail')); };
  im.src = url;
}
function makeSample() {
  if (!window.SAMPLE_CHARACTER) { makeFallbackSample(); return; }
  const im = new Image();
  im.onload = () => { setCharacter(im, im.naturalWidth, im.naturalHeight); };
  im.onerror = makeFallbackSample;
  im.src = window.SAMPLE_CHARACTER;
}
function makeFallbackSample() {
  const c = mkCanvas(320, 400), g = c.getContext('2d');
  g.lineJoin = 'round'; g.lineCap = 'round'; g.lineWidth = 7; g.strokeStyle = '#3a2840';
  const E = (x, y, rx, ry, rot, fill) => { g.fillStyle = fill; g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, TAU); g.fill(); g.stroke(); };
  E(104, 62, 26, 66, -0.14, '#fff0f6'); E(104, 66, 12, 46, -0.14, '#ffb8d0');
  E(216, 62, 26, 66, 0.14, '#fff0f6'); E(216, 66, 12, 46, 0.14, '#ffb8d0');
  E(120, 372, 34, 18, 0, '#fff0f6'); E(200, 372, 34, 18, 0, '#fff0f6');
  E(160, 292, 76, 80, 0, '#ffd9e8');
  E(160, 168, 112, 92, 0, '#fff7fa');
  E(46, 292, 20, 26, 0.5, '#fff0f6'); E(274, 292, 20, 26, -0.5, '#fff0f6');
  g.fillStyle = '#3a2840'; g.beginPath(); g.ellipse(122, 168, 11, 15, 0, 0, TAU); g.fill(); g.beginPath(); g.ellipse(198, 168, 11, 15, 0, 0, TAU); g.fill();
  g.fillStyle = '#fff'; disc(g, 118, 162, 4.5); disc(g, 194, 162, 4.5);
  g.fillStyle = 'rgba(255,120,170,.55)'; g.beginPath(); g.ellipse(94, 196, 15, 9, 0, 0, TAU); g.fill(); g.beginPath(); g.ellipse(226, 196, 15, 9, 0, 0, TAU); g.fill();
  g.lineWidth = 5; g.beginPath(); g.arc(152, 192, 8, 0.1, Math.PI - 0.1); g.stroke(); g.beginPath(); g.arc(168, 192, 8, 0.1, Math.PI - 0.1); g.stroke();
  setCharacter(c, 320, 400);
}
function resetPos() { st.ax = 0.5; st.ay = 0.89; st.size = 100; $('chrSize').value = 100; syncVals(); }

/* ============================== preview loop ============================== */
const cv = $('cv'), cx = cv.getContext('2d');
const PREVIEW_W = 720;
let phase = 0, playing = true, lastTs = 0, dragging = null;
const getDur = () => { const el = document.querySelector('#gifBox [data-gx-dur]'); return (el && parseFloat(el.value)) || 4; };
function sizeCanvas() {
  const h = Math.round(PREVIEW_W * sceneH() / SW);
  if (cv.width !== PREVIEW_W || cv.height !== h) { cv.width = PREVIEW_W; cv.height = h; }
}
function setPhase(p) { phase = clamp(p, 0, 1); $('scrub').value = Math.round(phase * 1000); }
function setPlaying(v) { playing = v; $('playBtn').textContent = v ? '❚❚' : '▶'; }
function tick(ts) {
  requestAnimationFrame(tick);
  const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0; lastTs = ts;
  if (playing && !dragging) { phase = (phase + dt / getDur()) % 1; $('scrub').value = Math.round(phase * 1000); }
  $('tm').textContent = (phase * getDur()).toFixed(1) + 's';
  if (!chr || $('cv').hidden) return;
  sizeCanvas();
  drawScene(cx, cv.width, phase);
}
requestAnimationFrame(tick);
$('playBtn').addEventListener('click', () => setPlaying(!playing));
$('scrub').addEventListener('input', e => { phase = e.target.value / 1000; setPlaying(false); });

/* drag the character in the preview */
function scenePt(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * SW, y: (e.clientY - r.top) / r.height * sceneH() };
}
cv.addEventListener('pointerdown', e => {
  const pt = scenePt(e), H = sceneH();
  dragging = { dx: st.ax * SW - pt.x, dy: st.ay * H - pt.y, was: playing };
  setPlaying(false); setPhase(0);
  cv.setPointerCapture(e.pointerId); cv.classList.add('dragging');
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const pt = scenePt(e), H = sceneH();
  st.ax = clamp((pt.x + dragging.dx) / SW, 0.06, 0.94);
  st.ay = clamp((pt.y + dragging.dy) / H, GROUND_Y + 0.03, 0.98);        // feet stay on the ground
});
const endDrag = () => { if (!dragging) return; if (dragging.was) setPlaying(true); dragging = null; cv.classList.remove('dragging'); };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

/* ============================== controls ============================== */
function activate(group, v) { group.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.v === v)); }
function bindGroup(id, key, after) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    st[key] = b.dataset.v; activate($(id), st[key]); if (after) after();
  });
}
bindGroup('ratioGroup', 'ratio', () => { if (gx) gx.refresh(); });
bindGroup('bgGroup', 'bg', () => { $('bgColorRow').hidden = st.bg !== 'solid'; });
bindGroup('fromGroup', 'from');
function syncVals() {
  $('chrSizeVal').textContent = st.size + '%';
  $('starAmtVal').textContent = st.stars;
}
$('chrSize').addEventListener('input', e => { st.size = +e.target.value; syncVals(); });
$('starAmt').addEventListener('input', e => { st.stars = +e.target.value; syncVals(); });
$('chrReset').addEventListener('click', resetPos);
$('ground').addEventListener('change', e => { st.ground = e.target.checked; });
$('shadow').addEventListener('change', e => { st.shadow = e.target.checked; });
$('beamColor').addEventListener('input', e => { st.beam = e.target.value; });
$('bgColor').addEventListener('input', e => { st.bgColor = e.target.value; });
function swatches(id, colors, input, key) {
  $(id).innerHTML = colors.map(c => '<button type="button" style="background:' + c + '" data-c="' + c + '" aria-label="' + c + '"></button>').join('');
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    st[key] = b.dataset.c; $(input).value = b.dataset.c;
  });
}
swatches('beamSw', ['#7dfbe6', '#c8ff6a', '#ffe66d', '#ff9fe5', '#9fb6ff', '#ffffff'], 'beamColor', 'beam');
swatches('bgSw', ['#2b2f6b', '#0f766e', '#7c3aed', '#f9a8d4', '#fde68a', '#0b0c0d'], 'bgColor', 'bgColor');

/* views */
let gifUrl = null;
function setView(v) {
  const gif = v === 'gif';
  $('cv').hidden = gif; $('gifImg').hidden = !gif; $('transport').hidden = gif;
  $('viewTabs').querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
}
$('viewTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) setView(b.dataset.view); });

/* image input */
$('pickBtn').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
$('sampleBtn').addEventListener('click', () => { makeSample(); resetPos(); setPhase(0); });
const stage = $('stage');
['dragenter', 'dragover'].forEach(n => stage.addEventListener(n, e => { e.preventDefault(); stage.classList.add('drag'); }));
['dragleave', 'drop'].forEach(n => stage.addEventListener(n, e => { e.preventDefault(); stage.classList.remove('drag'); }));
stage.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
document.addEventListener('paste', e => {
  for (const it of (e.clipboardData && e.clipboardData.items) || []) if (it.type.startsWith('image/')) { loadFile(it.getAsFile()); break; }
});

/* ============================== GIF export ============================== */
gx = GifExport.mount($('gifBox'), {
  getLang: () => lang,
  getSize: () => chr ? { w: SW, h: Math.round(sceneH()) } : null,
  renderFrame: (ctx, w, h, p) => drawScene(ctx, w, p),
  filename: () => 'catnapped.gif',
  defaults: { size: 480, fps: 15, dur: 4 },
  onDone: r => { gifUrl = r.url; $('gifImg').src = gifUrl; $('viewGifBtn').disabled = false; setView('gif'); }
});
const make = () => { if (!gx) return; $('gifBox').scrollIntoView({ behavior: 'smooth', block: 'center' }); gx.make(); };
$('makeTop').addEventListener('click', make);
$('makeBar').addEventListener('click', make);

/* ============================== language ============================== */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('langTabs').querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  const bs = document.querySelector('.brand > span'); if (bs) bs.childNodes[0].nodeValue = t('madeBy') + ' ';
  $('tagline').textContent = t('tagline');
  const d = document.querySelector('meta[name=description]'); if (d) d.content = t('tagline');
  if (chr) $('imgInfo').textContent = t('imgInfo', { w: chr.w, h: chr.h });
  if (gx) gx.refresh();
}
$('langTabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  lang = b.dataset.lang; try { localStorage.setItem('catnapped-lang', lang); } catch (x) {}
  applyLang();
});

/* ============================== init ============================== */
['beamColor', 'bgColor'].forEach(id => ColorPicker.attach($(id), { getLang: () => lang }));
syncVals();
makeSample();
applyLang();
</script>
</body>
